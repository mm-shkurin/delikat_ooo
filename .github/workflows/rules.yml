# Контракт API: пути фронта ↔ store_api.yaml
name: rules

permissions:
  contents: read

on:
  push:
    branches: [dev, main, 'features/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Paths (paths.js vs OpenAPI)
        run: python scripts/check_api_contract.py

      - name: Wire types (optional TS)
        run: python scripts/check_contract_types.py

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Hermetic pytest
        working-directory: backend
        run: >
          pytest usecase/tests -q
          --ignore=usecase/tests/test_oauth_fake.py
          --ignore=usecase/tests/test_catalog_http_validation.py

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        working-directory: frontend
        run: npm ci && npm test
