openapi: 3.0.3
info:
  title: Delikat Admin API
  version: 1.0.0
  description: |
    Staff-кабинет v1 (Wave 3+). Отдельный контракт от store_api.yaml.
    Auth: тот же Yandex OAuth + Bearer JWT, что у витрины (`store_api` auth).
    Доступ к ручкам — только аккаунты с staff-ролью `owner` | `manager` | `cashier`.
    Роль `owner` через эти ручки не назначается и не снимается (bootstrap/ops).
    Суммы integer RUB (позже). Поля JSON — snake_case.
    Story 12: session/me + roster assign.
    Story 13: staff catalog list/create/patch + image blob (Postgres) + anonymous media GET.
    Story 17: staff category list/create/patch/delete/order. Buyer live signal is store_api `x-websocket`.
    Orders / stats — later stories.

servers:
  - url: http://127.0.0.1:8000
    description: Local backend (dev)
  - url: https://api.example.delikat.local
    description: Production placeholder

tags:
  - name: staff
    description: Staff me + roster
  - name: staff-catalog
    description: Staff catalog write (owner/manager); stories 13 and 17
  - name: media
    description: Public product image bytes from Postgres

paths:
  /api/v1/staff/me:
    get:
      summary: Текущий staff-профиль
      description: |
        200 только если у Bearer-аккаунта роль `owner` | `manager` | `cashier`.
        Иначе 403 `forbidden` (не staff) или 401 `unauthorized`.
      operationId: getStaffMe
      tags: [staff]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden — не staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/members:
    get:
      summary: Список сотрудников
      description: |
        Доступ: `owner` | `manager`. Cashier → 403.
        Строки: active (привязанный user) и pending (invite по email до OAuth).
      operationId: listStaffMembers
      tags: [staff]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMemberList'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Назначить сотрудника по email
      description: |
        Body: `email` + `role` (`manager` | `cashier` only; никогда `owner`).
        - Если аккаунт с таким email уже есть → bind role, status `active`.
        - Иначе → создать pending; role активируется при первом OAuth с этим email.
        ACL: owner → manager|cashier; manager → cashier only.
      operationId: assignStaffMember
      tags: [staff]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAssignRequest'
      responses:
        '201':
          description: Создан / обновлён member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden — ACL / не staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      summary: Сменить роль сотрудника
      description: |
        Новая роль только `manager` | `cashier`. Target с ролью `owner` → 403 `owner_immutable`.
        ACL как у assign.
      operationId: updateStaffMemberRole
      tags: [staff]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRoleUpdate'
      responses:
        '200':
          description: Обновлённый member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden | owner_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: staff_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Убрать из staff
      description: |
        Target перестаёт быть staff (роль `none`). Target `owner` → 403 `owner_immutable`.
        ACL: owner → manager|cashier; manager → cashier only.
      operationId: removeStaffMember
      tags: [staff]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалён из roster / роль снята
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden | owner_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: staff_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/products:
    get:
      summary: Staff-список SKU
      description: |
        Доступ: `owner` | `manager`. Cashier → 403.
        Видит `hidden`. Сортировка: SALE → NEW → TOP → null, затем `created_at` desc, `id` asc.
        `q` — substring по `name` или `id`. `visibility` default `all`.
      operationId: listStaffCatalogProducts
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Поиск по name или id
        - name: visibility
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StaffCatalogVisibility'
          description: Default `all`
      responses:
        '200':
          description: Sorted staff product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProductList'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать SKU
      description: |
        `multipart/form-data`: поля товара + file `image` (обязателен).
        `properties` — JSON-массив строк ProductProperty в одном form-field.
        `id` slug `^[a-z][a-z0-9-]{0,31}$`; duplicate → 400 `product_id_taken`.
        badge=SALE → `compare_at_price_rub` required и > `price_rub`.
        После save `image_url` = `/api/v1/media/products/{id}`; `created_at` выставляет сервер.
      operationId: createStaffCatalogProduct
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffProductCreateForm'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProduct'
        '400':
          description: validation_error | product_id_taken | category_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      summary: Обновить SKU
      description: |
        JSON partial update. `id` / `created_at` immutable (не в body).
        badge=SALE → `compare_at_price_rub` must be set and > `price_rub` (с учётом текущих значений).
        Soft-hide / badge toggle строки — тот же PATCH (`hidden`, `badge`).
        Смена картинки — `PUT .../image`, не этим телом.
      operationId: patchStaffCatalogProduct
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffProductPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProduct'
        '400':
          description: validation_error | category_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: product_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/products/{product_id}/image:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      summary: Заменить изображение SKU
      description: |
        `multipart/form-data` с file `image` (jpeg/png/webp, ≤ 2 MiB).
        Пишет bytes + content-type в Postgres; `image_url` = `/api/v1/media/products/{product_id}`.
      operationId: putStaffCatalogProductImage
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated product (with new image_url)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProduct'
        '400':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: product_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/media/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Байты изображения товара
      description: |
        Без Bearer. Отдаёт stored bytes с Content-Type из Postgres.
        404 если blob отсутствует (например seed ещё на `/assets/...`).
      operationId: getProductMedia
      tags: [media]
      security: []
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: product_not_found | no blob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/categories:
    get:
      summary: Список категорий для кабинета
      description: |
        Owner и manager. Cashier → 403. В каждой строке `product_count` — все SKU, включая скрытые.
        Порядок: `sort_order`, затем `id` asc.
      operationId: listStaffCategories
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCategoryList'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать категорию
      description: |
        Id только при создании. `all` → 400 `category_id_reserved`. Занятый id → 400 `category_id_taken`.
        Пустая таблица получает `sort_order` 1. Иначе max+1 в той же записи. Дырку после удаления не заполнять.
      operationId: createStaffCategory
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCategoryCreate'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCategory'
        '400':
          description: validation_error | category_id_taken | category_id_reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/categories/order:
    put:
      summary: Записать полный порядок категорий
      description: |
        `ids` — все текущие id ровно один раз. Успех пишет `sort_order` с 1 по N.
        Чужой, повторный или неполный список → 400 `validation_error`.
        Объявлять раньше `/{category_id}`.
      operationId: reorderStaffCategories
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCategoryOrder'
      responses:
        '200':
          description: Список в новом порядке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCategoryList'
        '400':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/staff/catalog/categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: Переименовать категорию
      description: Меняется только title. Id в теле не принимается.
      operationId: patchStaffCategory
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCategoryPatch'
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCategory'
        '400':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: category_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить категорию и её товары
      description: |
        Стирает категорию и все её SKU, включая скрытые. Последнюю тоже можно.
        Заказы и корзина не меняются.
      operationId: deleteStaffCategory
      tags: [staff-catalog]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалена
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: category_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,31}$'
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,31}$'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - staff_not_found
            - owner_immutable
            - product_not_found
            - product_id_taken
            - category_not_found
            - category_id_taken
            - category_id_reserved
        message:
          type: string

    StaffRole:
      type: string
      enum: [owner, manager, cashier]
      description: Роль активного staff; `none` не возвращается в me/list (нет доступа).

    AssignableStaffRole:
      type: string
      enum: [manager, cashier]
      description: Роли, которые можно выдать/сменить через API кабинета (не owner).

    StaffMemberStatus:
      type: string
      enum: [active, pending]

    StaffMe:
      type: object
      required: [user_id, email, display_name, role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    StaffMember:
      type: object
      required: [member_id, email, role, status]
      properties:
        member_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
          description: null пока status=pending и аккаунт ещё не входил
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
          description: null для pending без профиля
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/StaffMemberStatus'

    StaffMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'

    StaffAssignRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AssignableStaffRole'

    StaffRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/AssignableStaffRole'

    StaffCatalogVisibility:
      type: string
      enum: [live, hidden, all]
      default: all

    ProductProperty:
      type: string
      enum: [chilled, frozen, fresh, premium]
      description: Same enum as store_api ProductProperty

    ProductBadge:
      type: string
      enum: [NEW, TOP, SALE]
      description: Same enum as store_api ProductBadge

    StaffProduct:
      type: object
      required:
        - id
        - name
        - category_id
        - default_weight_label
        - price_rub
        - popularity_score
        - properties
        - image_url
        - hidden
        - created_at
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
        name:
          type: string
        category_id:
          type: string
        default_weight_label:
          type: string
          example: "~350 г"
        price_rub:
          type: integer
          minimum: 1
          maximum: 99999
        compare_at_price_rub:
          type: integer
          nullable: true
          minimum: 1
          maximum: 99999
          description: Required and > price_rub when badge=SALE
        popularity_score:
          type: integer
          minimum: 0
          maximum: 100
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ProductProperty'
        badge:
          allOf:
            - $ref: '#/components/schemas/ProductBadge'
          nullable: true
        marble_grade_label:
          type: string
          nullable: true
        image_url:
          type: string
          example: /api/v1/media/products/rib
        description:
          type: string
          nullable: true
        hidden:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: Set on create; immutable on edit

    StaffProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffProduct'

    StaffProductCreateForm:
      type: object
      required:
        - id
        - name
        - category_id
        - default_weight_label
        - price_rub
        - popularity_score
        - properties
        - image
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
        name:
          type: string
        category_id:
          type: string
        default_weight_label:
          type: string
        price_rub:
          type: integer
          minimum: 1
          maximum: 99999
        compare_at_price_rub:
          type: integer
          nullable: true
        popularity_score:
          type: integer
          minimum: 0
          maximum: 100
        properties:
          type: string
          description: JSON array of ProductProperty, e.g. '["chilled","fresh"]'
        badge:
          allOf:
            - $ref: '#/components/schemas/ProductBadge'
          nullable: true
        marble_grade_label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        hidden:
          type: boolean
          default: false
        image:
          type: string
          format: binary
          description: jpeg/png/webp, max 2 MiB

    StaffProductPatch:
      type: object
      description: At least one property required; id and created_at not accepted
      properties:
        name:
          type: string
        category_id:
          type: string
        default_weight_label:
          type: string
        price_rub:
          type: integer
          minimum: 1
          maximum: 99999
        compare_at_price_rub:
          type: integer
          nullable: true
        popularity_score:
          type: integer
          minimum: 0
          maximum: 100
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ProductProperty'
        badge:
          allOf:
            - $ref: '#/components/schemas/ProductBadge'
          nullable: true
        marble_grade_label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        hidden:
          type: boolean

    StaffCategory:
      type: object
      required: [id, title, sort_order, product_count]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
        title:
          type: string
          minLength: 1
          maxLength: 120
        sort_order:
          type: integer
          minimum: 1
        product_count:
          type: integer
          minimum: 0
          description: Все SKU категории, включая скрытые

    StaffCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffCategory'

    StaffCategoryCreate:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
        title:
          type: string
          minLength: 1
          maxLength: 120

    StaffCategoryPatch:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120

    StaffCategoryOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 0
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,31}$'
