# Run from infra/:
#   copy .env.example .env && docker compose up -d --build
#
# URLs (defaults):
#   Hex API:               http://127.0.0.1:8000/health
#   Vite frontend:         http://127.0.0.1:5173/
#   Reference site:        http://127.0.0.1:8767/
#   Gateway (dev):         http://127.0.0.1:8080/
#
# Postgres/Redis are not published in this file; use docker-compose.override.yml
# (see adaptive-tutor pattern).

name: delikat

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: delikat-backend:local
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-api:
    profiles: ["mock-api"]
    image: delikat-mock-api:local
    build:
      context: ..
      dockerfile: infra/docker/mock-api.Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      FIXTURES_DIR: /fixtures
    volumes:
      - ../ProductSpecification/api-specs/examples:/fixtures:ro
    ports:
      - "127.0.0.1:${MOCK_API_HOST_PORT:-8001}:8000"

  frontend:
    image: delikat-frontend-dev:local
    build:
      context: ..
      dockerfile: infra/docker/frontend.dev.Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 5173
    volumes:
      - ../frontend:/app
      - ../site/assets:/app/public/assets:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT}:5173"
    depends_on:
      backend:
        condition: service_healthy

  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SITE_HOST_PORT}:80"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      site:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
